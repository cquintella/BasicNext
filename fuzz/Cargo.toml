[package]
name = "bn-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bn_frontend = { path = "../crates/bn_frontend" }
bn_source = { path = "../crates/bn_source" }

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

# Standalone: keep out of the root workspace (cargo-fuzz layout).
[workspace]
