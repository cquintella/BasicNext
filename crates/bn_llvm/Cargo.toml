[package]
name = "bn_llvm"
version = "0.4.5"
edition = "2024"
rust-version = "1.97"
description = "Basic Next LLVM textual backend"
license = "MPL-2.0"
publish = false

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bn_diag = { path = "../bn_diag" }
bn_ir = { path = "../bn_ir" }
bn_source = { path = "../bn_source" }
bn_types = { path = "../bn_types" }
