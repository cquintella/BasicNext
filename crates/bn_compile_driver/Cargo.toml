[package]
name = "bn_compile_driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Basic Next compilation driver: build orchestration, toolchain discovery and artifact linking"
license.workspace = true
publish = false

[lints]
workspace = true

# Forwards `bn_llvm`'s sqlite and json emission. Default on; `bnc --no-default-features` turns both off.
[features]
default = ["sqlite", "json"]
sqlite = ["bn_llvm/sqlite"]
json = ["bn_llvm/json"]

[dependencies]
bn_catalog = { path = "../bn_catalog" }
bn_diag = { path = "../bn_diag" }
bn_cli = { path = "../bn_cli" }
bn_llvm = { path = "../bn_llvm", default-features = false }
bn_source = { path = "../bn_source" }
