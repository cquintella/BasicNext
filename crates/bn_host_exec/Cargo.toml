[package]
name = "bn_host_exec"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Basic Next HOST.Exec core: one process-execution implementation shared by the interpreter and the native runtime"
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
bn_catalog = { path = "../bn_catalog" }
bn_types = { path = "../bn_types" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects"] }

[lints]
workspace = true
