name: binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install LLVM 22 and kernel dependencies
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y lld-22
          mkdir -p "${RUNNER_TEMP}/llvm-22"
          ln -s "$(command -v clang-22)" "${RUNNER_TEMP}/llvm-22/clang"
          ln -s "$(command -v wasm-ld-22)" "${RUNNER_TEMP}/llvm-22/wasm-ld"
          echo "${RUNNER_TEMP}/llvm-22" >> "${GITHUB_PATH}"
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Rust quality gate
        run: |
          tests/check-forbidden-deps.sh
          tests/check-shared-cores.sh
          bash tests/check-value-layout.sh
          cargo fmt --check
          # Native `bnc` links the bn_rt staticlib; cargo test alone may not emit it.
          cargo build -p bn_rt --locked
          # The parity suite runs the workspace executables bni/bnc.
          cargo build --locked --workspace --bins
          cargo test --locked --workspace --all-targets -- --test-threads=1
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Native capability gate
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            echo "::error::clang/LLVM is unavailable; install the repository-required LLVM toolchain before running native capability tests."
            exit 1
          fi
          cargo run --locked -p bnc -- examples/hello.bn -o "$RUNNER_TEMP/bn-hello"
          "$RUNNER_TEMP/bn-hello"
          PYTHONPATH=. python -m unittest tests/test_capabilities.py
      - name: Diagnostic and backend parity gates
        run: |
          python -m unittest tests/test_compiler_parity.py tests/test_wasm_parity.py
          cargo test --locked -p bn --test parity --test codegen_tests -- --test-threads=1
          cargo test --locked -p bni -p bnc --test cli -- --test-threads=1

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p bni -p bnc --bin bni --bin bnc
          cargo build --release --locked --target ${{ matrix.target }} -p bn_rt
      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p dist
          exe=""
          rt_src="libbn_rt.a"
          rt_dst="libbn_rt-${{ matrix.platform }}.a"
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            exe=".exe"
            rt_src="bn_rt.lib"
            rt_dst="bn_rt-${{ matrix.platform }}.lib"
          fi
          for name in bni bnc; do
            cp "target/${{ matrix.target }}/release/${name}${exe}" "dist/${name}-${{ matrix.platform }}${exe}"
            chmod +x "dist/${name}-${{ matrix.platform }}${exe}" || true
          done
          cp "target/${{ matrix.target }}/release/${rt_src}" "dist/${rt_dst}"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Stage man pages
        run: |
          mkdir -p dist
          cp docs/man/bni.1 docs/man/bnc.1 dist/
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="Compiled \`bni\` (interpreter) and \`bnc\` (compiler) from \`${GITHUB_SHA:0:7}\`. Release notes: docs/releases/${GITHUB_REF_NAME#v}.md."
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --clobber
            gh release edit "${tag}" --title "Basic Next ${tag}" --notes "${notes}" --latest
          else
            gh release create "${tag}" dist/* \
              --title "Basic Next ${tag}" \
              --notes "${notes}" \
              --latest
          fi
