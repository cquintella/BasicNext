[package]
name = "bnc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Basic Next compiler: bnc [compile-options] <entry.bn>"
license.workspace = true
publish = false

[[bin]]
name = "bnc"
path = "src/main.rs"

[lints]
workspace = true

# Forwards the compile driver's sqlite and json features. A normal build keeps both.
[features]
default = ["sqlite", "json"]
sqlite = ["bn_compile_driver/sqlite"]
json = ["bn_compile_driver/json"]

[dependencies]
bn_compile_driver = { path = "../bn_compile_driver", default-features = false }
