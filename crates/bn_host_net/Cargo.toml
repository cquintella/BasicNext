[package]
name = "bn_host_net"
version = "0.5.1"
edition = "2024"
rust-version = "1.97"
description = "Basic Next HOST.Net provider: sockets, resolution, ICMP, neighbours"
license = "MPL-2.0"
publish = false

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bn_diag = { path = "../bn_diag" }
bn_interp = { path = "../bn_interp" }
bn_source = { path = "../bn_source" }
bn_types = { path = "../bn_types" }
bn_value = { path = "../bn_value" }
bn_limits = { path = "../bn_limits" }
dns-lookup = "2"
socket2 = "0.6"
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt", "rt-multi-thread", "sync", "time"] }
