name: binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, reviewed 2026-09-23
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install LLVM 22 and kernel dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg ripgrep

          # apt.llvm.org publishes this fingerprint on its installation page.
          # Fingerprint: 6084 F3CF 814B 57C1 CF12 EFD5 15CF 4D18 AF4F 7421
          expected_fingerprint="6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          key_file="${RUNNER_TEMP}/llvm-snapshot.gpg.key"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --output "${key_file}" https://apt.llvm.org/llvm-snapshot.gpg.key
          actual_fingerprint=$(gpg --batch --show-keys --with-colons "${key_file}" \
            | awk -F: '$1 == "fpr" { print $10; exit }')
          if [[ "${actual_fingerprint}" != "${expected_fingerprint}" ]]; then
            echo "::error::unexpected apt.llvm.org signing-key fingerprint: ${actual_fingerprint:-<absent>}"
            exit 1
          fi

          keyring="${RUNNER_TEMP}/apt.llvm.org.gpg"
          gpg --batch --dearmor --output "${keyring}" "${key_file}"
          sudo install -m 0644 "${keyring}" /usr/share/keyrings/apt.llvm.org.gpg

          . /etc/os-release
          case "${VERSION_CODENAME}" in
            jammy|noble) llvm_suite="llvm-toolchain-${VERSION_CODENAME}-22" ;;
            *)
              echo "::error::unsupported Ubuntu suite for LLVM 22: ${VERSION_CODENAME}"
              exit 1
              ;;
          esac
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/${VERSION_CODENAME}/ ${llvm_suite} main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22
          mkdir -p "${RUNNER_TEMP}/llvm-22"
          ln -s "$(command -v clang-22)" "${RUNNER_TEMP}/llvm-22/clang"
          ln -s "$(command -v wasm-ld-22)" "${RUNNER_TEMP}/llvm-22/wasm-ld"
          echo "${RUNNER_TEMP}/llvm-22" >> "${GITHUB_PATH}"
      - name: Rust quality gate
        run: |
          tests/check-supply-chain.sh
          tests/check-language-policy.sh
          tests/check-forbidden-deps.sh
          tests/check-shared-cores.sh
          bash tests/check-value-layout.sh
          cargo fmt --check
          # Native `bnc` links the bn_rt staticlib; cargo test alone may not emit it.
          cargo build -p bn_rt --locked
          # The parity suite runs the workspace executables bni/bnc.
          cargo build --locked --workspace --bins
          cargo test --locked --workspace --all-targets -- --test-threads=1
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Native capability gate
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            echo "::error::clang/LLVM is unavailable; install the repository-required LLVM toolchain before running native capability tests."
            exit 1
          fi
          cargo run --locked -p bnc -- examples/hello.bn -o "$RUNNER_TEMP/bn-hello"
          "$RUNNER_TEMP/bn-hello"

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, reviewed 2026-09-23
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1),
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p bni -p bnc --bin bni --bin bnc
          cargo build --release --locked --target ${{ matrix.target }} -p bn_rt
      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p dist
          exe=""
          rt_src="libbn_rt.a"
          rt_dst="libbn_rt-${{ matrix.platform }}.a"
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            exe=".exe"
            rt_src="bn_rt.lib"
            rt_dst="bn_rt-${{ matrix.platform }}.lib"
          fi
          for name in bni bnc; do
            cp "target/${{ matrix.target }}/release/${name}${exe}" "dist/${name}-${{ matrix.platform }}${exe}"
            chmod +x "dist/${name}-${{ matrix.platform }}${exe}" || true
          done
          cp "target/${{ matrix.target }}/release/${rt_src}" "dist/${rt_dst}"
      - name: Test release bootstrap on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/install_windows.ps1 -DistDir dist -RepositoryRoot .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Stage release support files
        run: |
          set -euo pipefail
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          cp docs/man/bni.1 docs/man/bnc.1 dist/
          cp scripts/install.sh dist/
          cp scripts/install.ps1 dist/
          git archive --format=tar --prefix="BasicNext-${tag#v}/" "${GITHUB_SHA}" \
            | gzip -n > "dist/basicnext-source-${tag}.tar.gz"
          git archive --format=zip --prefix="BasicNext-${tag#v}/" \
            --output="dist/basicnext-source-${tag}.zip" "${GITHUB_SHA}"
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="Compiled \`bni\` (interpreter) and \`bnc\` (compiler) from \`${GITHUB_SHA:0:7}\`. Release notes: docs/releases/${GITHUB_REF_NAME#v}.md."
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --clobber
            gh release edit "${tag}" --title "Basic Next ${tag}" --notes "${notes}" --latest
          else
            gh release create "${tag}" dist/* \
              --title "Basic Next ${tag}" \
              --notes "${notes}" \
              --latest
          fi
