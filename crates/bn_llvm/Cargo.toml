[package]
name = "bn_llvm"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Basic Next LLVM textual backend"
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

# Default on so a normal `bnc` still emits `bn_rt_sqlite_*`. Off, `validate_for`
# rejects BNSqlite before link. The feature carries no crate of its own.
[features]
default = ["sqlite"]
sqlite = []

[dependencies]
bn_catalog = { path = "../bn_catalog" }
bn_core_text = { path = "../bn_core_text" }
bn_diag = { path = "../bn_diag" }
bn_ir = { path = "../bn_ir" }
bn_source = { path = "../bn_source" }
bn_types = { path = "../bn_types" }
