[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    # Permissive (BDFL decision, 2026-11-06): foldhash and zlib-rs.
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# The workspace's own crates are MPL-2.0 and never published: the license
# list is for the packages they depend on.
[licenses.private]
ignore = true

# Every platform the toolchain ships for, so a package one platform alone
# needs (the Windows console crates) is checked too.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
