[package]
name = "bnr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Basic Next interactive REPL: bnr"
license.workspace = true
publish = false

[[bin]]
name = "bnr"
path = "src/main.rs"

[features]
default = ["lib-math", "lib-json", "lib-log", "lib-data", "lib-dispatch", "lib-web", "lib-crypto", "lib-compress", "lib-sqlite", "lib-ffi"]
lib-math = ["bn_interpret_driver/lib-math"]
lib-json = ["bn_interpret_driver/lib-json"]
lib-log = ["bn_interpret_driver/lib-log"]
lib-data = ["bn_interpret_driver/lib-data"]
lib-dispatch = ["bn_interpret_driver/lib-dispatch"]
lib-web = ["bn_interpret_driver/lib-web"]
lib-crypto = ["bn_interpret_driver/lib-crypto"]
lib-compress = ["bn_interpret_driver/lib-compress"]
lib-sqlite = ["bn_interpret_driver/lib-sqlite"]
lib-ffi = ["bn_interpret_driver/lib-ffi"]

[lints]
workspace = true

[dependencies]
bn_catalog = { path = "../bn_catalog" }
bn_cli = { path = "../bn_cli" }
bn_diag = { path = "../bn_diag" }
bn_frontend = { path = "../bn_frontend" }
bn_interp = { path = "../bn_interp" }
bn_interpret_driver = { path = "../bn_interpret_driver" }
bn_ir = { path = "../bn_ir" }
bn_source = { path = "../bn_source" }
bn_value = { path = "../bn_value" }
rustyline = { version = "15.0", default-features = false, features = ["with-file-history", "with-dirs"] }
serde_json = "1.0"
