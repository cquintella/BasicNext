[package]
name = "bn_lib_web"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Basic Next BNWeb library provider: HTTP server/client, TLS, web state"
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bn_diag = { path = "../bn_diag" }
bn_interp = { path = "../bn_interp" }
bn_source = { path = "../bn_source" }
bn_types = { path = "../bn_types" }
bn_value = { path = "../bn_value" }
bn_host_net = { path = "../bn_host_net" }
bn_ir = { path = "../bn_ir" }
bn_limits = { path = "../bn_limits" }
bn_runtime = { path = "../bn_runtime" }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["http1", "http2", "server", "tokio"] }
ring = "0.17.14"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
