[package]
name = "bn_ir"
version = "0.4.5"
edition = "2024"
rust-version = "1.97"
description = "Basic Next language IR model and validator"
license = "MPL-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
bn_diag = { path = "../bn_diag" }
bn_source = { path = "../bn_source" }
bn_types = { path = "../bn_types" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
