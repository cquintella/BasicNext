marker = "DiagId::ModuleNotFound"
identity = "MODULE_NOT_FOUND"
catalog = "share/bn/diagnostics/en-US/lsp.ftl"
consumer = "src/lsp.rs"
state = "structured"

[[route]]
name = "module-graph-dynamic"
producer = "crates/bn_frontend/src/module_graph.rs"
marker = "fn module_error("
identity = "call-site"
catalog = "share/bn/diagnostics/en-US/lsp.ftl"
consumer = "src/lsp.rs"
state = "structured"

[[route]]
name = "ir-lowering"
producer = "crates/bn_frontend/src/lowering/helpers.rs"
marker = "DiagId::IrLowering"
identity = "IR_LOWERING"
catalog = "share/bn/diagnostics/en-US/runtime.ftl"
consumer = "src/main.rs"
state = "structured"

[[route]]
