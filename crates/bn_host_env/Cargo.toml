[package]
name = "bn_host_env"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
description = "Basic Next HOST.Env core: one process-environment reader shared by the interpreter and the native runtime"
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
bn_catalog = { path = "../bn_catalog" }
bn_types = { path = "../bn_types" }

[lints]
workspace = true

# The host name of log records (`host_name`): `uname` without unsafe code.
[target.'cfg(all(unix, not(target_os = "wasi")))'.dependencies]
rustix = { version = "1.1.4", features = ["system"] }
