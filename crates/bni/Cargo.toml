[package]
name = "bni"
version = "0.5.2"
edition = "2024"
rust-version = "1.98"
description = "Basic Next interpreter: bni run|eval|check|lex|lsp|dap"
license = "MPL-2.0"
publish = false

[[bin]]
name = "bni"
path = "src/main.rs"

[features]
default = ["lib-math", "lib-json", "lib-log", "lib-data", "lib-dispatch", "lib-web"]
lib-math = ["bn_interpret_driver/lib-math"]
lib-json = ["bn_interpret_driver/lib-json"]
lib-log = ["bn_interpret_driver/lib-log"]
lib-data = ["bn_interpret_driver/lib-data"]
lib-dispatch = ["bn_interpret_driver/lib-dispatch"]
lib-web = ["bn_interpret_driver/lib-web"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bn_cli = { path = "../bn_cli" }
bn_dap = { path = "../bn_dap" }
bn_interpret_driver = { path = "../bn_interpret_driver" }
bn_lsp = { path = "../bn_lsp" }

[dev-dependencies]
serde_json = "1.0"
