[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bn_frontend = { path = "../bn_frontend" }
bn_interp = { path = "../bn_interp" }
bn_interpret_driver = { path = "../bn_interpret_driver" }
bn_source = { path = "../bn_source" }
serde_json = "1.0"
