[package]
name = "bn_lsp"
version = "0.5.2"
description = "Basic Next Language Server Protocol adapter"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bn_diag = { path = "../bn_diag" }
bn_frontend = { path = "../bn_frontend" }
bn_source = { path = "../bn_source" }
bn_types = { path = "../bn_types" }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde_json = "1.0"
serde = "1.0"
