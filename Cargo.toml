[workspace]
members = ["crates/bn_catalog", "crates/bn_core_copy", "libraries/bn_core_compress", "libraries/bn_core_dispatch", "libraries/bn_core_log", "crates/bn_core_net", "libraries/bn_core_sqlite", "libraries/bn_core_json", "libraries/bn_web", "libraries/bn_core_math", "crates/bn_core_text", "crates/bn_rt", "libraries/bn_stdlib", "crates/bn_source", "crates/bn_types", "crates/bn_diag", "crates/bn_ir", "crates/bn_frontend", "crates/bn_runtime", "crates/bn_runtime_instrumentation", "crates/bn_value", "crates/bn_llvm", "crates/bn_interp", "crates/bn_host_env", "crates/bn_host_exec", "crates/bn_limits", "libraries/bn_lib_compress", "libraries/bn_lib_math", "libraries/bn_lib_json", "libraries/bn_lib_log", "libraries/bn_lib_data", "crates/bn_host_fs", "crates/bn_host_net", "libraries/bn_lib_dispatch", "libraries/bn_lib_web", "libraries/bn_lib_crypto", "libraries/bn_lib_sqlite", "libraries/bn_lib_ffi", "crates/bn_cli", "crates/bn_interpret_driver", "crates/bn_lsp", "crates/bn_dap", "crates/bn_compile_driver", "crates/bnc", "crates/bni", "crates/bnr"]
resolver = "3"

[workspace.package]
version = "0.6.10"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"

[package]
name = "bn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Basic Next workspace root: cross-crate integration tests only (no executable)"
license.workspace = true

[lib]
path = "src/lib.rs"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[lints]
workspace = true

[dependencies]
# None: this package only hosts the workspace-level integration tests.

# Integration tests under tests/ exercise the owning crates directly.
[dev-dependencies]
bn_catalog = { path = "crates/bn_catalog" }
bn_diag = { path = "crates/bn_diag" }
bn_frontend = { path = "crates/bn_frontend" }
bn_interp = { path = "crates/bn_interp" }
bn_interpret_driver = { path = "crates/bn_interpret_driver", features = ["lib-math", "lib-json", "lib-log", "lib-data", "lib-dispatch", "lib-web", "lib-crypto", "lib-compress", "lib-sqlite"] }
bn_ir = { path = "crates/bn_ir" }
bn_lib_web = { path = "libraries/bn_lib_web" } # tests/runtime.rs drives the web callback directly
bn_llvm = { path = "crates/bn_llvm" }
bn_lsp = { path = "crates/bn_lsp" }
bn_runtime = { path = "crates/bn_runtime" }
bn_runtime_instrumentation = { path = "crates/bn_runtime_instrumentation" }
bn_source = { path = "crates/bn_source" }
bn_types = { path = "crates/bn_types" }
bn_value = { path = "crates/bn_value" }
lsp-types = "0.97.0" # tests/cli.rs decodes LSP diagnostics
serde = { version = "1.0", features = ["derive"] } # tests/compiler_capabilities.rs typed catalog
serde_json = "1.0"
sha2 = "0.10" # tests/gates: stable hash of the S0 migration identity set
wait-timeout = "0.2.1" # tests/support: child-process timeouts

# tests/parity.rs: console size with stdout on a PTY, without unsafe.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.4", features = ["pty", "termios"] }

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.test]
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
