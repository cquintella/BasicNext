[package]
name = "bn_lib_data"
version = "0.5.1"
edition = "2024"
rust-version = "1.97"
description = "Basic Next BNData library provider (DataFrame over bn_rt primitives)"
license = "MPL-2.0"
publish = false

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bn_diag = { path = "../bn_diag" }
bn_interp = { path = "../bn_interp" }
bn_rt = { path = "../bn_rt" }
bn_source = { path = "../bn_source" }
bn_types = { path = "../bn_types" }
bn_value = { path = "../bn_value" }
