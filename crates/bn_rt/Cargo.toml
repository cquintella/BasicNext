[package]
name = "bn_rt"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Basic Next compiled runtime (HOST providers shared with the interpreter)"
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bn_host_exec = { path = "../bn_host_exec" }
dns-lookup = "2"
libc = "0.2"
sha2 = "0.10"
socket2 = "0.6"
