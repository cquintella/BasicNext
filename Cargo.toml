[workspace]
members = ["crates/bn_rt", "crates/bn_source", "crates/bn_types", "crates/bn_diag", "crates/bn_ir", "crates/bn_frontend", "crates/bn_runtime", "crates/bn_value", "crates/bn_llvm", "crates/bn_interp", "crates/bn_host_exec", "crates/bn_limits", "crates/bn_lib_math", "crates/bn_lib_json", "crates/bn_lib_log", "crates/bn_lib_data", "crates/bn_host_fs", "crates/bn_host_net", "crates/bn_lib_dispatch", "crates/bn_lib_web", "crates/bn_lib_crypto", "crates/bn_cli", "crates/bn_interpret_driver", "crates/bn_lsp", "crates/bn_dap", "crates/bn_compile_driver", "crates/bnc", "crates/bni"]
resolver = "3"

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"

[package]
name = "bn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Basic Next workspace root: cross-crate integration tests only (no executable)"
license.workspace = true

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
# None: this package only hosts the workspace-level integration tests.

# Integration tests under tests/ exercise the owning crates directly.
[dev-dependencies]
bn_diag = { path = "crates/bn_diag" }
bn_frontend = { path = "crates/bn_frontend" }
bn_interp = { path = "crates/bn_interp" }
bn_interpret_driver = { path = "crates/bn_interpret_driver" }
bn_ir = { path = "crates/bn_ir" }
bn_lib_web = { path = "crates/bn_lib_web" } # tests/runtime.rs drives the web callback directly
bn_llvm = { path = "crates/bn_llvm" }
bn_lsp = { path = "crates/bn_lsp" }
bn_runtime = { path = "crates/bn_runtime" }
bn_source = { path = "crates/bn_source" }
bn_types = { path = "crates/bn_types" }
bn_value = { path = "crates/bn_value" }
lsp-types = "0.97.0" # tests/cli.rs decodes LSP diagnostics
serde_json = "1.0"
