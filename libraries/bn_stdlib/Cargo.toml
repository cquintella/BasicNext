[package]
name = "bn_stdlib"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Basic Next BN* standard libraries native runtime and shared cores (BNCrypto, BNData, BNDispatch, BNFfi, BNJson, BNLog, BNMath, BNSqlite)"
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[lints]
workspace = true

[features]
default = ["sqlite", "json", "ffi"]
sqlite = ["dep:bn_core_sqlite"]
json = ["dep:bn_core_json", "dep:serde_json"]
ffi = ["dep:libffi", "dep:libloading"]

[dependencies]
bn_catalog = { path = "../../crates/bn_catalog" }
bn_core_compress = { path = "../bn_core_compress" }
bn_core_copy = { path = "../../crates/bn_core_copy" }
bn_core_dispatch = { path = "../bn_core_dispatch" }
bn_core_json = { path = "../bn_core_json", optional = true }
bn_core_log = { path = "../bn_core_log" }
bn_core_math = { path = "../bn_core_math" }
bn_core_sqlite = { path = "../bn_core_sqlite", optional = true }
bn_core_text = { path = "../../crates/bn_core_text" }
bn_limits = { path = "../../crates/bn_limits" }
bn_rt = { path = "../../crates/bn_rt" }
bn_types = { path = "../../crates/bn_types" }
libc = "0.2"
aes-gcm = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
curve25519-dalek = { version = "4.1", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "2.1", features = ["pkcs8"] }
hmac = "0.12"
libffi = { version = "5.2.0", optional = true }
libloading = { version = "0.9.0", optional = true }
ml-dsa = "0.1"
ml-kem = { version = "0.3", features = ["getrandom"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
serde_json = { version = "1.0", optional = true }
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1.8"
subtle = "2.6"
getrandom = "0.2"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
pkcs8 = { version = "0.10", default-features = false, features = ["pem", "encryption", "std", "getrandom"] }
