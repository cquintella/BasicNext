[package]
name = "bn_rt"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Basic Next compiled runtime (HOST providers shared with the interpreter)"
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[lints]
workspace = true

# Default on so a normal `bnc` link includes `HOST.Net`.
[features]
default = ["net"]
net = ["dep:bn_core_net"]

[dependencies]
bn_catalog = { path = "../bn_catalog" }
bn_core_copy = { path = "../bn_core_copy" } # handle tables of one module copy
bn_core_net = { path = "../bn_core_net", optional = true }
bn_core_text = { path = "../bn_core_text" }
bn_host_env = { path = "../bn_host_env" }
bn_host_exec = { path = "../bn_host_exec" }
bn_limits = { path = "../bn_limits" } # HOST.Net bounds shared with the interpreter
bn_types = { path = "../bn_types" } # scalar text shared with the interpreter
libc = "0.2"
