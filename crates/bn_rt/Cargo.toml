[package]
name = "bn_rt"
version = "0.4.3"
edition = "2024"
rust-version = "1.97"
description = "Basic Next compiled runtime (HOST providers shared with the interpreter)"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
dns-lookup = "2"
libc = "0.2"
socket2 = "0.6"
