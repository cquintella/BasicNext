[package]
name = "bn_rt"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Basic Next compiled runtime (HOST providers shared with the interpreter)"
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[lints]
workspace = true

# Default on so a normal `bnc` link still contains BNSqlite and BNJson. The
# proof build is `--no-default-features`, which drops `rusqlite`, `serde_json`,
# and the `bn_rt_sqlite_*` / `bn_rt_json_*` objects.
[features]
default = ["net", "sqlite", "json", "ffi"]
net = ["dep:bn_core_net"]
sqlite = ["dep:bn_core_sqlite"]
json = ["dep:bn_core_json", "dep:serde_json"]
ffi = ["dep:libffi", "dep:libloading"]

[dependencies]
bn_catalog = { path = "../bn_catalog" }
bn_core_copy = { path = "../bn_core_copy" } # handle tables of one module copy
bn_core_dispatch = { path = "../bn_core_dispatch" }
bn_core_log = { path = "../bn_core_log" }
bn_core_net = { path = "../bn_core_net", optional = true }
bn_core_math = { path = "../bn_core_math" }
bn_core_text = { path = "../bn_core_text" }
bn_host_env = { path = "../bn_host_env" }
bn_host_exec = { path = "../bn_host_exec" }
bn_limits = { path = "../bn_limits" } # HOST.Net bounds shared with the interpreter
bn_types = { path = "../bn_types" } # scalar text shared with the interpreter
libc = "0.2"
ml-dsa = "0.1"
ml-kem = { version = "0.3", features = ["getrandom"] }
p256 = { version = "0.13", features = ["ecdsa"] }
aes-gcm = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.1"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
bn_core_sqlite = { path = "../bn_core_sqlite", optional = true }
bn_core_json = { path = "../bn_core_json", optional = true }
serde_json = { version = "1.0", optional = true }
libffi = { version = "5.2.0", optional = true }
libloading = { version = "0.9.0", optional = true }
