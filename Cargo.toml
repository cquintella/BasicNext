[package]
name = "bn"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "Basic Next reference implementation"
license = "MPL-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bn"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["http1", "http2", "server", "tokio"] }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
ring = "0.17.14"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
