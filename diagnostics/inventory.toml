version = 1

# This is the executable DX01 route inventory. `state = "legacy"` means the
# producer still creates bn_diag::Diagnostic with free-form arguments and must
# be migrated by DX03. `structured` means it emits DiagnosticSpec/DiagId before
# presentation. Paths are repository-relative and verified by CI.
# The native runtime bridges are intentionally source-less C-ABI stderr
# boundaries; they cannot carry a SourceId/Span and remain explicit DX03
# exceptions until the native diagnostic ABI is versioned.

[[route]]
name = "lexer"
producer = "crates/bn_frontend/src/lexer.rs"
marker = "Diagnostic::lexical"
identity = "E0001"
catalog = "share/bn/diagnostics/en-US/lex.ftl"
consumer = "src/main.rs"
state = "structured"

[[route]]
name = "parser-expression"
producer = "crates/bn_frontend/src/parser/expressions.rs"
marker = "code: \"E0100\""
identity = "E0100"
catalog = "share/bn/diagnostics/en-US/parse.ftl"
consumer = "src/main.rs"
state = "structured"

[[route]]
name = "parser-declaration"
producer = "crates/bn_frontend/src/parser/phase4.rs"
marker = "code: \"E0100\""
identity = "E0100"
catalog = "share/bn/diagnostics/en-US/parse.ftl"
consumer = "src/lsp.rs"
state = "structured"

[[route]]
name = "semantic-errors"
producer = "crates/bn_frontend/src/semantic/helpers2.rs"
marker = "pub(crate) fn error(code: &'static str"
identity = "call-site"
catalog = "share/bn/diagnostics/en-US/sem.ftl"
consumer = "src/main.rs"
state = "structured"

[[route]]
name = "semantic-unused-import"
producer = "crates/bn_frontend/src/semantic/module_analysis.rs"
marker = "DiagId::UnusedImport"
identity = "UNUSED_IMPORT"
catalog = "share/bn/diagnostics/en-US/sem.ftl"
consumer = "src/lsp.rs"
state = "structured"

[[route]]
name = "semantic-unused-binding"
