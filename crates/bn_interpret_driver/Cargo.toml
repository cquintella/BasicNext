[package]
name = "bn_interpret_driver"
version = "0.5.2"
edition = "2024"
rust-version = "1.98"
description = "Basic Next interpretation driver: run, eval, HOST environment and shipped providers"
license = "MPL-2.0"
publish = false

[features]
default = []
lib-math = ["dep:bn_lib_math"]
lib-json = ["dep:bn_lib_json"]
lib-log = ["dep:bn_lib_log"]
lib-data = ["dep:bn_lib_data"]
lib-dispatch = ["dep:bn_lib_dispatch"]
lib-web = ["dep:bn_lib_web"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bn_cli = { path = "../bn_cli" }
bn_diag = { path = "../bn_diag" }
bn_frontend = { path = "../bn_frontend" }
bn_host_exec = { path = "../bn_host_exec" }
bn_host_fs = { path = "../bn_host_fs" }
bn_host_net = { path = "../bn_host_net" }
bn_interp = { path = "../bn_interp" }
bn_rt = { path = "../bn_rt" }
bn_lib_data = { path = "../bn_lib_data", optional = true }
bn_lib_dispatch = { path = "../bn_lib_dispatch", optional = true }
bn_lib_json = { path = "../bn_lib_json", optional = true }
bn_lib_log = { path = "../bn_lib_log", optional = true }
bn_lib_math = { path = "../bn_lib_math", optional = true }
bn_lib_web = { path = "../bn_lib_web", optional = true }
bn_source = { path = "../bn_source" }
bn_types = { path = "../bn_types" }
bn_value = { path = "../bn_value" }
serde_json = "1.0"
