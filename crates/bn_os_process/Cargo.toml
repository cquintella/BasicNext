[package]
name = "bn_os_process"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Basic Next HOST.Exec process control: process groups, job objects and signals, the operating-system side of the bn_host_exec core"
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
bn_host_exec = { path = "../bn_host_exec" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects"] }

[lints]
workspace = true
