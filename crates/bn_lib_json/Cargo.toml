[package]
name = "bn_lib_json"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Basic Next BNJson library provider"
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bn_diag = { path = "../bn_diag" }
bn_interp = { path = "../bn_interp" }
bn_source = { path = "../bn_source" }
bn_value = { path = "../bn_value" }
serde = "1.0"
serde_json = "1.0"
