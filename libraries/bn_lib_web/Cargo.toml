[package]
name = "bn_lib_web"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Basic Next BNWeb library provider: HTTP server/client, TLS, web state"
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
bn_catalog = { path = "../../crates/bn_catalog" }
bn_core_dispatch = { path = "../../crates/bn_core_dispatch" }
bn_core_log = { path = "../../crates/bn_core_log" }
bn_lib_dispatch = { path = "../../crates/bn_lib_dispatch" }
bn_lib_log = { path = "../../crates/bn_lib_log" }
bn_web = { path = "../bn_web" }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
bn_diag = { path = "../../crates/bn_diag" }
bn_interp = { path = "../../crates/bn_interp" }
bn_rt = { path = "../../crates/bn_rt" }
bn_source = { path = "../../crates/bn_source" }
bn_types = { path = "../../crates/bn_types" }
bn_value = { path = "../../crates/bn_value" }
bn_host_net = { path = "../../crates/bn_host_net" }
bn_ir = { path = "../../crates/bn_ir" }
bn_limits = { path = "../../crates/bn_limits" }
bn_runtime = { path = "../../crates/bn_runtime" }
