[package]
name = "bni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Basic Next interpreter: bni run|eval|check|lex|lsp|dap"
license.workspace = true
publish = false

[[bin]]
name = "bni"
path = "src/main.rs"

[features]
default = ["lib-math", "lib-json", "lib-log", "lib-data", "lib-dispatch", "lib-web", "lib-crypto"]
lib-math = ["bn_interpret_driver/lib-math"]
lib-json = ["bn_interpret_driver/lib-json"]
lib-log = ["bn_interpret_driver/lib-log"]
lib-data = ["bn_interpret_driver/lib-data"]
lib-dispatch = ["bn_interpret_driver/lib-dispatch"]
lib-web = ["bn_interpret_driver/lib-web"]
lib-crypto = ["bn_interpret_driver/lib-crypto"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bn_cli = { path = "../bn_cli" }
bn_dap = { path = "../bn_dap" }
bn_interpret_driver = { path = "../bn_interpret_driver" }
bn_lsp = { path = "../bn_lsp" }

[dev-dependencies]
bn_frontend = { path = "../bn_frontend" }
bn_lsp = { path = "../bn_lsp" }
bn_source = { path = "../bn_source" }
lsp-types = "0.97.0"
serde_json = "1.0"
