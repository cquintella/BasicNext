[package]
name = "bn_frontend"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Basic Next source frontend and semantic analysis"
license.workspace = true
build = "build.rs"

[features]
default = ["frontend-host-spec-path"]
frontend-host-spec-path = []

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bn_diag = { path = "../bn_diag" }
bn_ir = { path = "../bn_ir" }
bn_source = { path = "../bn_source" }
bn_types = { path = "../bn_types" }
